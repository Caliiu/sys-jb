services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    # Log do container limitado: até 3 arquivos de 10 MB (sem isso, cresce até encher o disco).
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?defina no .env}
      SYSJB_MIGRATOR_PASSWORD: ${SYSJB_MIGRATOR_PASSWORD:?defina no .env}
      SYSJB_APP_PASSWORD: ${SYSJB_APP_PASSWORD:?defina no .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sysjb']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
